# SkyPilot recipe for deploying a standalone Agent Mesh control plane + router (agentmesh-one)
# on any cloud provider (GCP, AWS, Azure, OCI, or Kubernetes).
#
# Production deployment with a permanent custom domain:
#   sky launch -y -c agentmesh-hub deploy/skypilot/agentmesh-one.yaml --detach-run \
#     --env AGENTMESH_EXTERNAL_URL=https://mesh.example.com \
#     --secret AGENTMESH_TUNNEL_TOKEN
#
# Quick deployment with an automatic HTTPS tunnel:
#   sky launch -y -c agentmesh-hub deploy/skypilot/agentmesh-one.yaml --detach-run
#   sky logs agentmesh-hub 1 --no-follow
#
# Note: For lightweight testing, you can lower `cpus: 0.25+` and `memory: 1+`
# to run on cloud free-tier instances (such as GCP `e2-micro` or AWS `t4g.micro`).

name: agentmesh-hub

resources:
  disk_size: 20
  use_spot: false
  any_of:
    - infra: gcp
      instance_type: e2-standard-2
    - cpus: 2+
      memory: 4+

envs:
  AGENTMESH_EXTERNAL_URL: ""

secrets:
  AGENTMESH_TUNNEL_TOKEN: ""

setup: |
  set -euo pipefail
  if ! command -v agentmesh-one >/dev/null 2>&1; then
    ARCH="$(uname -m)"
    case "${ARCH}" in
      x86_64*) ARCH_NAME="x86_64" ;;
      aarch64*|arm64*) ARCH_NAME="arm64" ;;
      *) echo "Unsupported architecture: ${ARCH}" >&2; exit 1 ;;
    esac
    VERSION=$(curl -fsSL -o /dev/null -w "%{url_effective}" "https://github.com/google/agentmesh/releases/latest" | sed 's|.*/||')
    if [[ -z "${VERSION}" || "${VERSION}" == "releases" ]]; then
      VERSION=$(curl -fsSL "https://api.github.com/repos/google/agentmesh/releases?per_page=1" | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
    fi
    TMP_DIR=$(mktemp -d)
    curl -fsSL -o "${TMP_DIR}/agentmesh.tar.gz" "https://github.com/google/agentmesh/releases/download/${VERSION}/agentmesh_Linux_${ARCH_NAME}.tar.gz"
    tar -xzf "${TMP_DIR}/agentmesh.tar.gz" -C "${TMP_DIR}"
    sudo mv "${TMP_DIR}/agentmesh-one" "${TMP_DIR}/agentmesh-node" /usr/local/bin/
    rm -rf "${TMP_DIR}"
  fi

run: |
  set -euo pipefail
  mkdir -p "${HOME}/agentmesh-one"

  ARGS=(
    --data-dir "${HOME}/agentmesh-one"
    --port 8080
    --tunnel cloudflare
    --tunnel-install
  )
  if [[ -n "${AGENTMESH_EXTERNAL_URL:-}" ]]; then
    ARGS+=(--external-url "${AGENTMESH_EXTERNAL_URL}")
  fi

  exec agentmesh-one "${ARGS[@]}"
