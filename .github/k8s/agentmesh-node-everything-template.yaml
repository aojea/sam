apiVersion: v1
kind: ConfigMap
metadata:
  name: agentmesh-canary-everything-config-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
data:
  agentmesh-node.yaml: |
    version: "v1alpha1"
    attenuation:
      policies: []
      checks: []
      rules: []
    services:
      - type: mcp
        name: everything
        description: "MCP everything test server (tools, resources, prompts)"
        target_url: "http://localhost:3001/mcp"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: everything-canary-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: everything-canary-${ENV_NAME}
  template:
    metadata:
      labels:
        app: everything-canary-${ENV_NAME}
        agentmesh-canary: "true"
    spec:
      serviceAccountName: agentmesh-node-sa
      containers:
      - name: server-everything
        image: node:22-slim
        command: ["npx", "-y", "@modelcontextprotocol/server-everything", "streamableHttp"]
        ports:
        - containerPort: 3001
          name: http-mcp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      - name: agentmesh-node
        image: ghcr.io/google/agentmesh-node:${IMAGE_TAG}
        env:
        - name: AGENTMESH_API_TOKEN
          value: "secret-token"
        args: 
          - "run"
          - "--config=/etc/agentmesh/agentmesh-node.yaml"
          - "--control-plane=http://agentmesh-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
          - "--insecure-control-plane"
          - "--jwt-path=/var/run/secrets/tokens/agentmesh-token"
          - "--bind-addr=127.0.0.1:8080"
          - "--metrics-addr=0.0.0.0:9090"
        ports:
        - containerPort: 8080
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: config-volume
          mountPath: /etc/agentmesh
        - name: agentmesh-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: agentmesh-canary-everything-config-${ENV_NAME}
      - name: agentmesh-token
        projected:
          sources:
          - serviceAccountToken:
              path: agentmesh-token
              expirationSeconds: 3600
              audience: "agentmesh-control-plane-audience"
