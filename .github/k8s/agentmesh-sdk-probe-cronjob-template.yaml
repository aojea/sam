# The cold path through the SDKs, on a schedule. Four fresh identities enroll
# with the control plane, two per SDK: an agent written with the official A2A
# SDK, which joins through a router and accepts A2A requests for a2a://agent,
# and a caller, which reaches an MCP service a agentmesh-node serves (the everything
# canary) by name and the other language's agent by peer ID, first with the
# mesh SDK's own client for the agent card, then with the A2A SDK's client for
# a message. An agent publishes nothing; the caller learns its peer ID from the
# line the agent prints, through a volume the pod shares. The programs are the
# examples the READMEs embed, unchanged; the shell around them only retries
# discovery, which a member that joined seconds ago can miss, waits for the
# agent, and prints one verdict line. The agents are native sidecars, stopped
# when both callers exit, so the Job completes. The control plane's
# --node-retention sweep reclaims the rows.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentmesh-sdk-probe-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
spec:
  schedule: "7,22,37,52 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # One attempt: a retry would hide exactly the flakiness this exists to
      # measure. A failed Job is the signal; both callers must succeed.
      backoffLimit: 0
      # Three calls with up to 120s each, plus enrollment.
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app: agentmesh-sdk-probe-${ENV_NAME}
        spec:
          # Bound to the agentmesh-canary role by deploy.yaml's policy seed, which
          # is what lets the callers reach the canaries and the agents.
          serviceAccountName: agentmesh-node-sa
          restartPolicy: Never
          # The agent sidecars run under a shell that pipes to tee; the shell
          # gets the SIGTERM, the agent the SIGKILL that follows.
          terminationGracePeriodSeconds: 10
          # The agents' stdout goes both to the container log and to the
          # shared volume, where the callers read the peer ID from it.
          initContainers:
          - name: js-agent
            restartPolicy: Always
            image: ghcr.io/google/agentmesh-sdk-js:${IMAGE_TAG}
            command: ["/bin/sh", "-c", "node build/examples/a2a-agent.js 2>&1 | tee /var/run/agentmesh/js-agent.log"]
            env:
            - name: AGENTMESH_CONTROL_PLANE_URL
              value: "http://agentmesh-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
            - name: AGENTMESH_INSECURE_CONTROL_PLANE
              value: "true"
            - name: AGENTMESH_JWT_PATH
              value: /var/run/secrets/tokens/agentmesh-token
            - name: AGENTMESH_STATE_DIR
              value: /var/run/agentmesh/js-agent
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: agentmesh-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: agentmesh-state
              mountPath: /var/run/agentmesh
          - name: python-agent
            restartPolicy: Always
            image: ghcr.io/google/agentmesh-sdk-python:${IMAGE_TAG}
            command: ["/bin/sh", "-c", "python examples/a2a_agent.py 2>&1 | tee /var/run/agentmesh/python-agent.log"]
            env:
            - name: AGENTMESH_CONTROL_PLANE_URL
              value: "http://agentmesh-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
            - name: AGENTMESH_INSECURE_CONTROL_PLANE
              value: "true"
            - name: AGENTMESH_JWT_PATH
              value: /var/run/secrets/tokens/agentmesh-token
            - name: AGENTMESH_STATE_DIR
              value: /var/run/agentmesh/python-agent
            - name: PYTHONUNBUFFERED
              value: "1"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: agentmesh-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: agentmesh-state
              mountPath: /var/run/agentmesh
          containers:
          - name: js
            image: ghcr.io/google/agentmesh-sdk-js:${IMAGE_TAG}
            env:
            - name: AGENTMESH_CONTROL_PLANE_URL
              value: "http://agentmesh-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
            - name: AGENTMESH_INSECURE_CONTROL_PLANE
              value: "true"
            - name: AGENTMESH_JWT_PATH
              value: /var/run/secrets/tokens/agentmesh-token
            - name: AGENTMESH_STATE_DIR
              value: /var/run/agentmesh/js
            - name: PROBE
              value: agentmesh-sdk-js
            - name: CALL
              value: "node build/examples/call.js"
            - name: A2A_CALL
              value: "node build/examples/a2a-call.js"
            - name: AGENT_LOG
              # Where the other SDK's agent prints its peer ID.
              value: /var/run/agentmesh/python-agent.log
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: agentmesh-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: agentmesh-state
              mountPath: /var/run/agentmesh
            - name: probe-script
              mountPath: /etc/agentmesh-probe
              readOnly: true
            command: ["/bin/sh", "/etc/agentmesh-probe/probe.sh"]
          - name: python
            image: ghcr.io/google/agentmesh-sdk-python:${IMAGE_TAG}
            env:
            - name: AGENTMESH_CONTROL_PLANE_URL
              value: "http://agentmesh-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
            - name: AGENTMESH_INSECURE_CONTROL_PLANE
              value: "true"
            - name: AGENTMESH_JWT_PATH
              value: /var/run/secrets/tokens/agentmesh-token
            - name: AGENTMESH_STATE_DIR
              value: /var/run/agentmesh/python
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PROBE
              value: agentmesh-sdk-python
            - name: CALL
              value: "python examples/call.py"
            - name: A2A_CALL
              value: "python examples/a2a_call.py"
            - name: AGENT_LOG
              value: /var/run/agentmesh/js-agent.log
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: agentmesh-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: agentmesh-state
              mountPath: /var/run/agentmesh
            - name: probe-script
              mountPath: /etc/agentmesh-probe
              readOnly: true
            command: ["/bin/sh", "/etc/agentmesh-probe/probe.sh"]
          volumes:
          - name: agentmesh-state
            emptyDir: {}
          - name: probe-script
            configMap:
              name: agentmesh-sdk-probe-script-${ENV_NAME}
          - name: agentmesh-token
            projected:
              sources:
              - serviceAccountToken:
                  path: agentmesh-token
                  expirationSeconds: 3600
                  audience: "agentmesh-control-plane-audience"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentmesh-sdk-probe-script-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
data:
  probe.sh: |
    #!/bin/sh
    # Runs the SDK's call examples against a agentmesh-node's MCP service and the
    # other SDK's agent, and prints one JSON verdict line. PROBE names the
    # run, CALL and A2A_CALL are the examples' command lines, AGENT_LOG is
    # where the other SDK's agent prints "accepting a2a://agent as <peer>".
    # Discovery is
    # retried: a member that joined seconds ago has a thin routing table, and
    # a provider record can name a pod a rollout just replaced. The first
    # call enrolls with the projected token; the later ones resume from
    # AGENTMESH_STATE_DIR.
    set -u
    START=$(date +%s)

    fail() {
      printf '{"probe":"%s","ok":false,"stage":"%s","error":"%s","elapsed_s":%d}\n' \
        "$PROBE" "$1" "$(printf '%s' "$2" | tr -d '"\n' | cut -c1-300)" "$(( $(date +%s) - START ))"
      exit 1
    }

    # call <program> <stage> <expected substring> <arguments...>; sets PROVIDER.
    call() {
      program=$1; stage=$2; want=$3; shift 3
      stage_start=$(date +%s)
      attempts=0
      while :; do
        attempts=$((attempts + 1))
        # A program that hangs is a failure to report, not a job to let the deadline kill silently.
        out=$(timeout -k 5 120 $program "$@" 2>&1); rc=$?
        if [ $rc -eq 0 ] && printf '%s' "$out" | grep -q "$want"; then
          PROVIDER=$(printf '%s' "$out" | grep -o 'is served by [^ ]*' | tail -1 | cut -d' ' -f4)
          return 0
        fi
        [ $rc -eq 124 ] && out="$out (hung for 120s)"
        [ $(( $(date +%s) - stage_start )) -ge 120 ] && fail "$stage" "no answer with '$want' in 120s ($attempts attempts; last: $(printf '%s' "$out" | tail -c 200))"
        sleep 5
      done
    }

    # wait_for_agent <log>: sets AGENT_PEER from the agent's accepting line.
    wait_for_agent() {
      wait_start=$(date +%s)
      while :; do
        AGENT_PEER=$(grep -o 'accepting a2a://agent as [^ ]*' "$1" 2>/dev/null | tail -1 | cut -d' ' -f4)
        [ -n "$AGENT_PEER" ] && return 0
        [ $(( $(date +%s) - wait_start )) -ge 120 ] && fail agent "no agent announced itself in $1 within 120s"
        sleep 2
      done
    }

    # 1. Enroll, join and call an MCP service a agentmesh-node serves.
    call "$CALL" node-mcp 'Echo: agentmesh-sdk-probe' mcp://everything echo '{"message": "agentmesh-sdk-probe"}'
    NODE_PEER=$PROVIDER
    NODE_S=$(( $(date +%s) - START ))

    # 2. The other SDK's agent, by peer ID, over /libp2p-http through the
    #    router: its agent card, with the mesh SDK's own client.
    wait_for_agent "$AGENT_LOG"
    A2A_START=$(date +%s)
    call "$CALL" sdk-card 'Echo agent' "$AGENT_PEER" a2a://agent /.well-known/agent-card.json
    CARD_S=$(( $(date +%s) - A2A_START ))

    # 3. A message to the same agent with the A2A SDK's client: the answer
    #    names the caller the agent's server saw as the verified peer.
    MESSAGE_START=$(date +%s)
    call "$A2A_CALL" sdk-message "said: hello from ${PROBE}" "$AGENT_PEER" "hello from ${PROBE}"
    MESSAGE_S=$(( $(date +%s) - MESSAGE_START ))

    printf '{"probe":"%s","ok":true,"node_s":%d,"node_provider":"%s","card_s":%d,"message_s":%d,"agent_peer":"%s","elapsed_s":%d}\n' \
      "$PROBE" "$NODE_S" "$NODE_PEER" "$CARD_S" "$MESSAGE_S" "$AGENT_PEER" "$(( $(date +%s) - START ))"
