# A resident fleet: members that join the mesh and stay, publishing nothing
# and calling nothing. The other canaries are two pods each and restart when
# their own service misbehaves, so between rollouts nobody watches what a
# plain member experiences over days: a router rollout under it, the daily
# key rotation, its credential refresh. These do. Readiness is the node's
# /readyz, which is 200 only while it holds an authenticated router
# connection, so a member that lost the mesh is a pod that is not ready and
# the canary alerts see it. There is deliberately no liveness probe: a
# restart would hide exactly the reconnection this fleet exists to observe.
#
# Every pod carries sam-canary=true, so the canary PodMonitoring scrapes
# sam_node_mesh_connected from each; sam-monitoring-template.yaml alerts on
# a member that reads 0 for five minutes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sam-soak-config-${ENV_NAME}
  namespace: sam-canary-${ENV_NAME}
data:
  sam-node.yaml: |
    version: "v1alpha1"
    attenuation:
      policies: []
      checks: []
      rules: []
    services: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sam-soak-${ENV_NAME}
  namespace: sam-canary-${ENV_NAME}
spec:
  replicas: 20
  # A rollout of this fleet is itself a burst of joiners; let it be one
  # rather than a trickle.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sam-soak-${ENV_NAME}
  template:
    metadata:
      labels:
        app: sam-soak-${ENV_NAME}
        sam-canary: "true"
    spec:
      # Bound to the sam-canary role by deploy.yaml's policy seed.
      serviceAccountName: sam-node-sa
      terminationGracePeriodSeconds: 10
      containers:
      - name: sam-node
        image: ghcr.io/google/sam-node:${IMAGE_TAG}
        args:
          - "run"
          - "--config=/etc/sam/sam-node.yaml"
          - "--control-plane=http://sam-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
          - "--insecure-control-plane"
          - "--jwt-path=/var/run/secrets/tokens/sam-token"
          - "--data-dir=/var/run/sam/data"
          # Socket only: no TCP listener, so no API token to hand out.
          - "--bind-addr="
          - "--socket-path=/var/run/sam/node.sock"
          - "--metrics-addr=0.0.0.0:9090"
        ports:
        - containerPort: 9090
          name: metrics
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 10
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: config-volume
          mountPath: /etc/sam
        - name: sam-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
        - name: sam-uds
          mountPath: /var/run/sam
      volumes:
      - name: config-volume
        configMap:
          name: sam-soak-config-${ENV_NAME}
      - name: sam-uds
        emptyDir: {}
      - name: sam-token
        projected:
          sources:
          - serviceAccountToken:
              path: sam-token
              expirationSeconds: 3600
              audience: "sam-control-plane-audience"
