# Scrape targets for Google Managed Prometheus, which GKE runs by default.
# A PodMonitoring only sees pods in its own namespace, so the canaries get
# their own below.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: agentmesh-control-plane-${ENV_NAME}
  namespace: ${NAMESPACE}
spec:
  selector:
    matchLabels:
      app: agentmesh-control-plane-${ENV_NAME}
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: agentmesh-router-${ENV_NAME}
  namespace: ${NAMESPACE}
spec:
  selector:
    matchLabels:
      app: agentmesh-router-${ENV_NAME}
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
---
# Every canary pod carries agentmesh-canary=true; a pod without one of these named
# ports is simply not a target for that endpoint.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: agentmesh-canaries-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
spec:
  selector:
    matchLabels:
      agentmesh-canary: "true"
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
  - port: box-metrics
    path: /metrics
    interval: 30s
  targetLabels:
    fromPod:
    - from: app
      to: canary
---
# Alerts on the conditions behind past testnet outages. A Rules object
# evaluates over series scraped in its own namespace, so the control plane
# and router PodMonitorings above are what these see. Each alert names in
# its description what to look at first.
apiVersion: monitoring.googleapis.com/v1
kind: Rules
metadata:
  name: agentmesh-${ENV_NAME}
  namespace: ${NAMESPACE}
spec:
  groups:
  - name: agentmesh
    interval: 60s
    rules:
    # A router that refuses inbound connections closes them before TLS, so a
    # member only sees "stream closed" and the router's own log shows
    # nothing unless this counter moves. per_ip_limit from one source for
    # long means the per-IP count has drifted from the sockets that exist.
    - alert: AgentMeshRouterRefusingInboundConnections
      expr: sum by (pod, reason) (rate(agentmesh_router_inbound_connections_refused_total[10m])) > 0.01
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Router {{ $labels.pod }} is refusing inbound connections ({{ $labels.reason }})"
        description: "{{ $value | humanize }} refusals/s for 15m. `kubectl logs {{ $labels.pod }} | grep '\\[Conn\\] Refused'` names the source IPs; compare agentmesh_router_conns_per_source_ip_limit with the connections the router really holds from that IP (`ss -tn` in its network namespace). A restart of the router clears a drifted per-IP count."
    # One peer failing the handshake every few seconds for an hour holds a
    # credential the control plane no longer signs for, or a peer that
    # cannot pull /keys; it also floods the router log.
    - alert: AgentMeshRouterHandshakesFailing
      expr: sum by (pod) (rate(agentmesh_router_auth_handshakes_total{result="unauthorized"}[10m])) > 0.05
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Router {{ $labels.pod }} rejects handshakes continuously"
        description: "{{ $value | humanize }} unauthorized handshakes/s for 1h. `kubectl logs {{ $labels.pod }} | grep 'Authorization failed'` names the peer; a credential signed by a retired key means that member did not follow the last rotation (agentmesh_control_plane_retiring_key_expiry_timestamp_seconds says when the retiring key stopped verifying)."
    # Every router renews its lease within a minute; a router that stops is
    # down or cannot reach the control plane, and the DNS and /info lists
    # keep advertising it until the lease lapses. Both control plane
    # replicas export the same figure; max collapses them, and the slack
    # covers the scrape interval and the store's refresh TTL.
    - alert: AgentMeshRouterLeaseNotRenewed
      expr: time() - max by (namespace, router) (agentmesh_control_plane_router_lease_renewed_timestamp_seconds) > 600
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Router {{ $labels.router }} has not renewed its lease for 5m"
        description: "Last renewal {{ $value | humanizeDuration }} ago. Check the router pod's state and `agentmesh_router_lease_renewals_total{result!=\"ok\"}` on it."
    # The mesh had no router at all for a scrape: nothing can enroll, join
    # or be reached.
    - alert: AgentMeshNoActiveRouter
      expr: agentmesh_control_plane_routers_active < 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "No router holds a lease on ${ENV_NAME}"
    # A key rotation whose grace period ends while members still hold the
    # retiring key is how members fall off the mesh at once; two keys for
    # longer than the configured grace period means a rotation did not
    # complete.
    - alert: AgentMeshSigningKeyRotationStuck
      expr: agentmesh_control_plane_signing_keys > 2 or (agentmesh_control_plane_retiring_key_expiry_timestamp_seconds - time() < 0)
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Signing key set on ${ENV_NAME} is not the expected one current key plus at most one retiring key"
        description: "agentmesh_control_plane_signing_keys={{ $value }}; check the keyring and the control plane log for 'Key rotation'."
    # The control plane's own view of the mesh is stale: its store read
    # failed, so every gauge above is the last good one.
    - alert: AgentMeshControlPlaneStoreUnreadable
      expr: agentmesh_control_plane_mesh_state_scrape_success == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Control plane on ${ENV_NAME} cannot read its store"
---
# The canaries' verdict is their readiness; a canary pod that is not ready
# is a member that cannot reach its agent across the mesh.
apiVersion: monitoring.googleapis.com/v1
kind: Rules
metadata:
  name: agentmesh-canaries-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
spec:
  groups:
  - name: agentmesh-canaries
    interval: 60s
    rules:
    - alert: AgentMeshCanaryNotReady
      expr: min by (pod) (kube_pod_status_ready{namespace="agentmesh-canary-${ENV_NAME}",condition="true"}) == 0
      for: 20m
      labels:
        severity: warning
      annotations:
        summary: "Canary {{ $labels.pod }} on ${ENV_NAME} has not been ready for 20m"
        description: "`kubectl logs -n agentmesh-canary-${ENV_NAME} {{ $labels.pod }} -c caller | tail -3` gives the error and the per-router detail of the last calls."
    # A member's own account of the mesh: its node holds no authenticated
    # router connection. A router rollout costs a member seconds; five
    # minutes is a member that cannot get back, which after a key rotation
    # or a refresh is how a fleet falls off the mesh one pod at a time. The
    # soak fleet (agentmesh-soak-template.yaml) exists to make this fire first.
    - alert: AgentMeshCanaryMemberDisconnected
      expr: min by (pod) (agentmesh_node_mesh_connected{namespace="agentmesh-canary-${ENV_NAME}"}) == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Member {{ $labels.pod }} on ${ENV_NAME} has had no router for 5m"
        description: "`kubectl logs -n agentmesh-canary-${ENV_NAME} {{ $labels.pod }} -c agentmesh-node | grep -iE 'router|auth|renew' | tail -5` says whether it cannot dial, is refused at the handshake, or holds a credential that no longer verifies; compare with agentmesh_router_auth_handshakes_total and agentmesh_router_inbound_connections_refused_total on the routers."
