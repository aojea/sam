# The cold path, on a schedule: a node with no identity enrolls with the
# control plane, authenticates to a router, finds a service on the mesh and
# speaks MCP to it through the mesh, then reaches an agent written with each
# SDK by peer ID, and exits. The long-lived canaries only do this when a pod
# restarts, so between rollouts nobody re-checks that a new user could still
# join. Each run enrolls fresh identities, the node's and the agents'; the
# control plane's --node-retention sweep reclaims the rows.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sam-probe-${ENV_NAME}
  namespace: sam-canary-${ENV_NAME}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # One attempt: a retry would hide exactly the flakiness this exists to
      # measure. A failed Job is the signal.
      backoffLimit: 0
      # 180s to be ready, 120s to reach a provider, 120s for the SDK
      # agents, with headroom.
      activeDeadlineSeconds: 480
      template:
        metadata:
          labels:
            app: sam-probe-${ENV_NAME}
        spec:
          # Bound to the sam-canary role by deploy.yaml's policy seed, which
          # is what lets the probe call the canaries' services.
          serviceAccountName: sam-node-sa
          restartPolicy: Never
          # The agent sidecars run under a shell that pipes to tee; the shell
          # gets the SIGTERM, the agent the SIGKILL that follows.
          terminationGracePeriodSeconds: 10
          initContainers:
          # Native sidecars: they stay up for the probe container's lifetime
          # and are stopped when that container exits, so the Job completes.
          - name: sam-node
            restartPolicy: Always
            image: ghcr.io/google/sam-node:${IMAGE_TAG}
            args:
              - "run"
              - "--config=/etc/sam/sam-node.yaml"
              - "--control-plane=http://sam-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
              - "--insecure-control-plane"
              - "--jwt-path=/var/run/secrets/tokens/sam-token"
              - "--data-dir=/var/run/sam/data"
              # Socket only: no TCP listener, so no API token to hand out.
              - "--bind-addr="
              - "--socket-path=/var/run/sam/node.sock"
              - "--metrics-addr=127.0.0.1:9090"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
            volumeMounts:
            - name: config-volume
              mountPath: /etc/sam
            - name: sam-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: sam-uds
              mountPath: /var/run/sam
          # An agent written with each SDK (sdk/js/examples/agent.ts,
          # sdk/python/examples/agent.py), the programs the docs embed. Each
          # accepts A2A requests for a2a://agent and publishes nothing; its
          # stdout goes to the container log and to the shared volume, where
          # the probe reads its peer ID.
          - name: js-agent
            restartPolicy: Always
            image: ghcr.io/google/sam-sdk-js:${IMAGE_TAG}
            command: ["/bin/sh", "-c", "node build/examples/agent.js 2>&1 | tee /var/run/sam-agents/js-agent.log"]
            env:
            - name: SAM_CONTROL_PLANE_URL
              value: "http://sam-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
            - name: SAM_INSECURE_CONTROL_PLANE
              value: "true"
            - name: SAM_JWT_PATH
              value: /var/run/secrets/tokens/sam-token
            - name: SAM_STATE_DIR
              value: /var/run/sam-agents/js-agent
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: sam-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: sam-agents
              mountPath: /var/run/sam-agents
          - name: python-agent
            restartPolicy: Always
            image: ghcr.io/google/sam-sdk-python:${IMAGE_TAG}
            command: ["/bin/sh", "-c", "python examples/agent.py 2>&1 | tee /var/run/sam-agents/python-agent.log"]
            env:
            - name: SAM_CONTROL_PLANE_URL
              value: "http://sam-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
            - name: SAM_INSECURE_CONTROL_PLANE
              value: "true"
            - name: SAM_JWT_PATH
              value: /var/run/secrets/tokens/sam-token
            - name: SAM_STATE_DIR
              value: /var/run/sam-agents/python-agent
            - name: PYTHONUNBUFFERED
              value: "1"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: sam-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: sam-agents
              mountPath: /var/run/sam-agents
          containers:
          - name: probe
            image: alpine/curl:8.12.1
            # The node's socket is 0600 and owned by the uid the node runs as;
            # the probe is that uid rather than root with an override.
            securityContext:
              runAsUser: 65532
              runAsGroup: 65532
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            env:
            - name: PROBE_SERVICE
              # The everything canary's MCP server (sam-node-everything-template.yaml):
              # a real server, so the node advertises it and initialize succeeds.
              value: everything
            - name: SDK_AGENTS
              # The agent sidecars above, by the log each prints its peer ID to.
              value: "js python"
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            volumeMounts:
            - name: sam-uds
              mountPath: /var/run/sam
            - name: sam-agents
              mountPath: /var/run/sam-agents
              readOnly: true
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -u
              SOCK=/var/run/sam/node.sock
              READYZ=http://127.0.0.1:9090/readyz
              START=$(date +%s)

              # One JSON line per run, for a log-based metric; the exit code is
              # what the Job reports.
              fail() {
                printf '{"probe":"sam-cold-path","ok":false,"stage":"%s","error":"%s","elapsed_s":%d}\n' \
                  "$1" "$(printf '%s' "$2" | tr -d '"\n' | cut -c1-300)" "$(( $(date +%s) - START ))"
                exit 1
              }

              # 1. Enroll and authenticate to a router: the node's /readyz.
              until [ "$(curl -s -o /dev/null -w '%{http_code}' "$READYZ")" = "200" ]; do
                [ $(( $(date +%s) - START )) -ge 180 ] && fail enroll "node not ready after 180s"
                sleep 2
              done
              READY_S=$(( $(date +%s) - START ))

              # 2. The router answers a dial.
              CONN=$(curl -sf --unix-socket "$SOCK" http://localhost/debug/connectivity) \
                || fail connectivity "GET /debug/connectivity failed"
              printf '%s' "$CONN" | grep -q '"router_error":false' \
                || fail connectivity "router dial failed: $CONN"
              ROUTER_MS=$(printf '%s' "$CONN" | grep -oE '"router_latency_ms":[0-9]+' | grep -oE '[0-9]+$')
              PEERS=$(printf '%s' "$CONN" | grep -oE '"connected_peers":[0-9]+' | grep -oE '[0-9]+$')

              # 3. A service someone else advertised is discoverable, and one
              # of its providers answers an MCP initialize through the mesh.
              # Discovery is best-effort per peer: a provider record can name a
              # pod that a rollout just replaced, and a node that joined
              # seconds ago has a thin routing table. So every provider is
              # tried, the whole thing is retried for a while, and how long it
              # took is itself reported. No trailing slash on the call: the
              # path maps onto the service's target_url as-is. The body is JSON
              # or an SSE frame; either names the server.
              PEER=""
              TRIED=0
              LAST_ERR=""
              REACH_START=$(date +%s)
              while [ -z "$PEER" ]; do
                if curl -sf --unix-socket "$SOCK" -o /tmp/providers.json \
                  "http://localhost/sam/service/discover?type=mcp&name=${PROBE_SERVICE}&timeout=20s"; then
                  for p in $(grep -oE '"peer_id":"[^"]+"' /tmp/providers.json | cut -d'"' -f4); do
                    TRIED=$((TRIED + 1))
                    set -- $(curl -s --unix-socket "$SOCK" -o /tmp/init.out -w '%{http_code} %{time_total}' \
                      -X POST "http://localhost/sam/${p}/mcp/${PROBE_SERVICE}" \
                      -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
                      -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"sam-probe","version":"0"}}}')
                    # curl prints "000 0" when it cannot connect; the defaults
                    # cover curl printing nothing at all, so set -u cannot end
                    # the run without a verdict line.
                    if [ "${1:-}" = "200" ] && grep -q '"serverInfo"' /tmp/init.out; then
                      PEER=$p; CALL_S=${2:-0}
                      break
                    fi
                    LAST_ERR="${p}: HTTP ${1:-000} $(head -c 120 /tmp/init.out | tr -d '"\n')"
                  done
                fi
                [ -n "$PEER" ] && break
                [ $(( $(date +%s) - REACH_START )) -ge 120 ] && fail call "no provider of ${PROBE_SERVICE} answered initialize in 120s (${TRIED} attempts; last: ${LAST_ERR:-none discovered})"
                sleep 5
              done
              REACH_S=$(( $(date +%s) - REACH_START ))

              # 4. An agent written with each SDK, reachable by peer ID alone:
              # it published nothing, so there is nothing to discover, and the
              # node finds the path through the router by itself. The probe
              # reads the peer ID from the line the agent printed, then calls
              # its A2A endpoint through the egress proxy, the way an agent
              # behind this node reaches another agent. The answer names the
              # verified caller.
              SDK_START=$(date +%s)
              SDK_PEERS=""
              for lang in ${SDK_AGENTS}; do
                AGENT_LOG=/var/run/sam-agents/${lang}-agent.log
                AGENT_PEER=""
                while [ -z "$AGENT_PEER" ]; do
                  AGENT_PEER=$(grep -o 'accepting a2a://agent as [^ ]*' "$AGENT_LOG" 2>/dev/null | tail -1 | cut -d' ' -f4)
                  [ -n "$AGENT_PEER" ] && break
                  [ $(( $(date +%s) - SDK_START )) -ge 120 ] && fail sdk "the ${lang} agent announced no peer ID in 120s"
                  sleep 2
                done
                LAST_ERR=""
                CALL_START=$(date +%s)
                while :; do
                  CODE=$(curl -s --unix-socket "$SOCK" -o /tmp/sdk-card.out -w '%{http_code}' "http://localhost/sam/${AGENT_PEER}/a2a/agent/card")
                  if [ "$CODE" = "200" ] && grep -q '"caller"' /tmp/sdk-card.out; then
                    break
                  fi
                  LAST_ERR="HTTP ${CODE} $(head -c 160 /tmp/sdk-card.out | tr -d '"\n')"
                  [ $(( $(date +%s) - CALL_START )) -ge 120 ] && fail sdk "the ${lang} agent ${AGENT_PEER} did not answer its card in 120s (last: ${LAST_ERR})"
                  sleep 5
                done
                SDK_PEERS="${SDK_PEERS}${SDK_PEERS:+,}\"${lang}\":\"${AGENT_PEER}\""
              done
              SDK_S=$(( $(date +%s) - SDK_START ))

              printf '{"probe":"sam-cold-path","ok":true,"ready_s":%d,"router_latency_ms":%s,"connected_peers":%s,"reach_s":%d,"providers_tried":%d,"call_s":%s,"provider":"%s","sdk_s":%d,"sdk_agents":{%s},"elapsed_s":%d}\n' \
                "$READY_S" "${ROUTER_MS:-null}" "${PEERS:-null}" "$REACH_S" "$TRIED" "$CALL_S" "$PEER" "$SDK_S" "$SDK_PEERS" "$(( $(date +%s) - START ))"
          volumes:
          - name: config-volume
            configMap:
              name: sam-probe-config-${ENV_NAME}
          - name: sam-uds
            emptyDir: {}
          - name: sam-agents
            emptyDir: {}
          - name: sam-token
            projected:
              sources:
              - serviceAccountToken:
                  path: sam-token
                  expirationSeconds: 3600
                  audience: "sam-control-plane-audience"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sam-probe-config-${ENV_NAME}
  namespace: sam-canary-${ENV_NAME}
data:
  sam-node.yaml: |
    version: "v1alpha1"
    attenuation:
      policies: []
      checks: []
      rules: []
    services: []
