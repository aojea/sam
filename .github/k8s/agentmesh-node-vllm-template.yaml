apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache-pvc-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentmesh-canary-vllm-config-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
data:
  agentmesh-node.yaml: |
    version: "v1alpha1"
    attenuation:
      policies:
        - 'allow if service("inference", "vllm-tpu"), user("system:serviceaccount:agentmesh-canary-${ENV_NAME}:agentmesh-node-sa");'
        - 'allow if service("system", "/mesh/catalog");'
      checks: []
      rules: []
    services:
      - type: inference
        name: vllm-tpu
        description: "vLLM TPU Inference Service"
        target_url: "http://localhost:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-canary-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-canary-${ENV_NAME}
  template:
    metadata:
      labels:
        app: vllm-canary-${ENV_NAME}
        agentmesh-canary: "true"
    spec:
      serviceAccountName: agentmesh-node-sa
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
        cloud.google.com/gke-tpu-topology: "1x1"
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node.kubernetes.io/memory-pressure"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: vllm-tpu
        image: vllm/vllm-tpu:latest
        resources:
          requests:
            cpu: 1000m
            memory: 16Gi
            google.com/tpu: "1"
          limits:
            google.com/tpu: "1"
        command: ["/bin/bash", "-c"]
        args:
        - |
          python3 -m vllm.entrypoints.openai.api_server \
            --model google/gemma-2-2b-it \
            --tensor-parallel-size 1 \
            --max-model-len 2048 \
            --enforce-eager \
            --host 0.0.0.0 \
            --port 8000 \
            --trust-remote-code \
            --enable-auto-tool-choice \
            --tool-call-parser hermes
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: vllm-secret-${ENV_NAME}
              key: hf-token
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: hf-cache
          mountPath: /root/.cache/huggingface
      - name: agentmesh-node
        image: ghcr.io/google/agentmesh-node:${IMAGE_TAG}
        env:
        - name: AGENTMESH_API_TOKEN
          value: "secret-token"
        args: 
          - "run"
          - "--config=/etc/agentmesh/agentmesh-node.yaml"
          - "--control-plane=http://agentmesh-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
          - "--insecure-control-plane"
          - "--jwt-path=/var/run/secrets/tokens/agentmesh-token"
          - "--bind-addr=127.0.0.1:8080"
          - "--metrics-addr=0.0.0.0:9090"
        ports:
        - containerPort: 8080
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: config-volume
          mountPath: /etc/agentmesh
        - name: agentmesh-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
      volumes:
      - name: hf-cache
        persistentVolumeClaim:
          claimName: hf-cache-pvc-${ENV_NAME}
      - name: config-volume
        configMap:
          name: agentmesh-canary-vllm-config-${ENV_NAME}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: agentmesh-token
        projected:
          sources:
          - serviceAccountToken:
              path: agentmesh-token
              expirationSeconds: 3600
              audience: "agentmesh-control-plane-audience"
