apiVersion: v1
kind: ConfigMap
metadata:
  name: agentmesh-sdk-canary-script-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
data:
  canary.sh: |
    #!/bin/sh
    # Sends the agent beside this container a message with the A2A SDK's
    # client every INTERVAL seconds, by the peer ID it printed to
    # $AGENTMESH_CANARY_DIR/agent.log, and keeps $AGENTMESH_CANARY_DIR/reachable present
    # while the last call succeeded; the readiness probe reads it. One JSON
    # line per call, for a log-based metric. The first call enrolls with the
    # projected token; the later ones resume from AGENTMESH_STATE_DIR.
    # tests/integration runs this script against the example programs.
    set -u
    INTERVAL=${INTERVAL:-300}
    LOG=${AGENTMESH_CANARY_DIR:-/var/run/agentmesh}/agent.log
    REACHABLE=${AGENTMESH_CANARY_DIR:-/var/run/agentmesh}/reachable

    verdict() {
      printf '{"canary":"%s","ok":%s,"agent_peer":"%s","call_s":%d,"error":"%s","detail":"%s"}\n' \
        "$CANARY" "$1" "${AGENT_PEER:-}" "$2" "$(printf '%s' "$3" | tr -d '"\n' | cut -c1-300)" "$(printf '%s' "${4:-}" | tr -d '"' | tr '\n' ' ' | cut -c1-600)"
    }

    # The line naming the error: Node prints it before the stack trace and
    # Python after, so the end of the output is not the place to look.
    reason() {
      printf '%s\n' "$1" | grep -m1 -E '^[A-Za-z_.]*(Error|Exception)\b' || printf '%s' "$1" | tail -c 200
    }

    # What the SDKs put under the error line: one indented line per address
    # or router tried and why it failed (NO_RESERVATION, a closed stream, a
    # refused handshake). Only lines after the error line count, so neither
    # Python's source frames nor Node's throw site are taken; Node's stack
    # frames ("at ...") and its error-list brackets are dropped too.
    detail() {
      printf '%s\n' "$1" | sed -n '/^[A-Za-z_.]*\(Error\|Exception\)\b/,$p' | tail -n +2 \
        | grep -E '^[[:space:]]+[^[:space:]]' | grep -vE '^[[:space:]]+(at |\[errors\]|\]|\}|code:|\[cause\])' | sed 's/^[[:space:]]*//; s/,$//' | head -8
    }

    while :; do
      AGENT_PEER=$(grep -o 'accepting a2a://agent as [^ ]*' "$LOG" 2>/dev/null | tail -1 | cut -d' ' -f4)
      if [ -z "$AGENT_PEER" ]; then
        sleep 2
        continue
      fi
      start=$(date +%s)
      out=$($CALL "$AGENT_PEER" "hello from ${CANARY}" 2>&1); rc=$?
      if [ $rc -eq 0 ] && printf '%s' "$out" | grep -q "said: hello from ${CANARY}"; then
        touch "$REACHABLE"
        verdict true $(( $(date +%s) - start )) ""
        sleep "$INTERVAL"
      else
        rm -f "$REACHABLE"
        verdict false $(( $(date +%s) - start )) "$(reason "$out")" "$(detail "$out")"
        # A failed call is retried soon; the readiness probe already shows it.
        sleep 30
      fi
    done
