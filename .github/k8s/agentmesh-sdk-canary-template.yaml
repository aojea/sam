# Two long-lived pairs of SDK members with no agentmesh-node beside them: an agent
# written with one SDK and the official A2A SDK, and a caller written with the
# other, in one pod, both example programs (sdk/js/examples,
# sdk/python/examples) unchanged. The agent joins through a router and accepts
# A2A requests for a2a://agent; it publishes nothing, so the caller learns its
# peer ID from the line it prints, through a volume the pod shares, and sends
# it a message with the A2A SDK's client every few minutes. The caller is Ready
# while its last call succeeded, so the Deployment's availability is the
# answer to "can an agent written with one SDK still be reached by the other
# after hours on the mesh": relay reservations renewed, credentials refreshed,
# the control plane followed. Both enroll with the pod's projected service
# account token, the way every other canary does, and keep their identity in
# an emptyDir, so a container restart resumes and a new pod enrolls afresh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: js-agent-canary-${ENV_NAME}
  namespace: agentmesh-canary-${ENV_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: js-agent-canary-${ENV_NAME}
  template:
    metadata:
      labels:
        app: js-agent-canary-${ENV_NAME}
        agentmesh-canary: "true"
    spec:
      serviceAccountName: agentmesh-node-sa
      terminationGracePeriodSeconds: 10
      containers:
      - name: agent
        image: ghcr.io/google/agentmesh-sdk-js:${IMAGE_TAG}
        command: ["/bin/sh", "-c", "node build/examples/a2a-agent.js 2>&1 | tee /var/run/agentmesh/agent.log"]
        env:
        - name: AGENTMESH_CONTROL_PLANE_URL
          value: "http://agentmesh-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
        - name: AGENTMESH_INSECURE_CONTROL_PLANE
          value: "true"
        - name: AGENTMESH_JWT_PATH
          value: /var/run/secrets/tokens/agentmesh-token
        - name: AGENTMESH_STATE_DIR
          value: /var/run/agentmesh/agent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - name: agentmesh-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
        - name: agentmesh-state
          mountPath: /var/run/agentmesh
      - name: caller
        image: ghcr.io/google/agentmesh-sdk-python:${IMAGE_TAG}
        command: ["/bin/sh", "/etc/agentmesh-canary/canary.sh"]
        env:
        - name: AGENTMESH_CONTROL_PLANE_URL
          value: "http://agentmesh-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
        - name: AGENTMESH_INSECURE_CONTROL_PLANE
          value: "true"
        - name: AGENTMESH_JWT_PATH
          value: /var/run/secrets/tokens/agentmesh-token
        - name: AGENTMESH_STATE_DIR
          value: /var/run/agentmesh/caller
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: CANARY
          value: python-calls-js-agent
        - name: CALL
          value: "python examples/a2a_call.py"
        readinessProbe:
          exec:
            command: ["test", "-f", "/var/run/agentmesh/reachable"]
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - name: agentmesh-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
        - name: agentmesh-state
          mountPath: /var/run/agentmesh
        - name: canary-script
          mountPath: /etc/agentmesh-canary
          readOnly: true
      volumes:
      - name: agentmesh-state
        emptyDir: {}
      - name: canary-script
        configMap:
          name: agentmesh-sdk-canary-script-${ENV_NAME}
      - name: agentmesh-token
        projected:
          sources:
          - serviceAccountToken:
              path: agentmesh-token
              expirationSeconds: 3600
              audience: "agentmesh-control-plane-audience"
---
