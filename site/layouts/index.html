<!doctype html>
<html lang="{{ .Site.Language.Lang }}" class="no-js">

<head>
  {{ partial "head.html" . }}
</head>

<body class="agentmesh-landing-page">
  <div class="mesh-grid"></div>
  <div class="mesh-glow-cyan"></div>
  <div class="mesh-glow-yellow"></div>

  <div class="landing-container" style="flex-direction: column; text-align: center; max-width: 800px;">
    <!-- Hero Branding -->
    <div class="hero-brand-col" style="align-items: center;">
      <h1 class="landing-title">Agent Mesh</h1>
      <p class="landing-description" style="text-align: center; max-width: 600px; margin-left: auto; margin-right: auto;">
        A private network for AI agents: publish tools and models, find and call them across machines, with every call authenticated and authorized by name.
      </p>

      <div class="landing-actions" style="justify-content: center;">
        <a href="{{ "/docs/" | relURL }}" class="btn-sleek btn-cyan">Documentation</a>
        <a href="{{ .Site.Params.github_repo }}" target="_blank" rel="noopener" class="btn-sleek btn-dark">GitHub</a>
      </div>
    </div>
  </div>

  {{ partial "scripts.html" . }}
</body>

</html>
