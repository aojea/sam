version: 2
project_name: sam
# Deliberately not released: sam-bench (a measurement instrument for people
# working on the mesh, built from the repo, not something operators install)
# and chaos-agent (a Python dev tool).
builds:
  - id: sam-node
    main: ./cmd/sam-node
    binary: sam-node
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
  - id: sam-control-plane
    main: ./cmd/sam-control-plane
    binary: sam-control-plane
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
  - id: sam-router
    main: ./cmd/sam-router
    binary: sam-router
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
  - id: mcp-client
    main: ./cmd/mcp-client
    binary: mcp-client
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
  - id: sam-console
    main: ./cmd/sam-console
    binary: sam-console
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
  - id: sam-one
    main: ./cmd/sam-one
    binary: sam-one
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
