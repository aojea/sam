version: 2
project_name: sam
# Deliberately not released: sam-bench (a measurement instrument for people
# working on the mesh, built from the repo, not something operators install)
# and chaos-agent (a Python dev tool).
builds:
  - id: sam-node
    main: ./cmd/sam-node
    binary: sam-node
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: sam-control-plane
    main: ./cmd/sam-control-plane
    binary: sam-control-plane
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: sam-router
    main: ./cmd/sam-router
    binary: sam-router
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: mcp-client
    main: ./cmd/mcp-client
    binary: mcp-client
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: sam-box
    main: ./cmd/sam-box
    binary: sam-box
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: sam-console
    main: ./cmd/sam-console
    binary: sam-console
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: sam-one
    main: ./cmd/sam-one
    binary: sam-one
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: nano-init
    main: .
    # nano-init is its own module: it carries a userspace TCP stack, and that
    # dependency has no business in the graph every other binary builds from.
    dir: ./cmd/nano-init
    binary: nano-init
    env:
      - CGO_ENABLED=0
    # linux only: nano-init is PID 1 inside a Linux sandbox — TUN ioctls,
    # netlink, namespaces and vsock have no meaning anywhere else.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    # nano-init only builds for linux (see build id "nano-init" above), so the
    # windows and darwin archives intentionally have one fewer binary.
    allow_different_binary_count: true
