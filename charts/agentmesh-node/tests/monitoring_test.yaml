suite: agentmesh-node monitoring
templates:
  - templates/monitoring.yaml
release:
  name: agentmesh-node
tests:
  - it: renders nothing by default, since both kinds are CRDs the cluster may lack
    set:
      controlPlaneUrl: http://agentmesh-control-plane:8080
    asserts:
      - hasDocuments:
          count: 0

  - it: podMonitoring selects the node pods on the metrics port
    set:
      controlPlaneUrl: http://agentmesh-control-plane:8080
      monitoring.podMonitoring.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodMonitoring
      - isAPIVersion:
          of: monitoring.googleapis.com/v1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: agentmesh-node
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].interval
          value: 30s

  - it: podMonitor renders the prometheus-operator shape with extra labels
    set:
      controlPlaneUrl: http://agentmesh-control-plane:8080
      monitoring.podMonitor.enabled: true
      monitoring.podMonitor.labels:
        release: kube-prometheus-stack
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodMonitor
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: spec.podMetricsEndpoints[0].port
          value: metrics

  - it: renders nothing when the metrics listener is disabled
    set:
      controlPlaneUrl: http://agentmesh-control-plane:8080
      metricsPort: 0
      monitoring.podMonitoring.enabled: true
      monitoring.podMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 0
