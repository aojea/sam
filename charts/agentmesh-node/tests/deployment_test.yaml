suite: agentmesh-node deployment
templates:
  # configmap.yaml and secret.yaml must be loaded for the checksum includes to resolve
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secret.yaml
tests:
  - it: fails without controlPlaneUrl
    template: templates/deployment.yaml
    asserts:
      - failedTemplate: {}

  - it: renders a bare node with one container
    template: templates/deployment.yaml
    set:
      controlPlaneUrl: http://agentmesh-control-plane:8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: agentmesh-node
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--control-plane=http://agentmesh-control-plane:8080"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--insecure-control-plane"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--bind-addr=127.0.0.1:8080"
      - equal:
          path: spec.template.spec.volumes[2].projected.sources[0].serviceAccountToken.audience
          value: agentmesh-audience

  - it: does not opt into plaintext for an https control plane
    template: templates/deployment.yaml
    set:
      controlPlaneUrl: https://hub.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--control-plane=https://hub.example.com"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--insecure-control-plane"

  - it: reads the API token from a mounted Secret, never from env or argv
    template: templates/deployment.yaml
    set:
      controlPlaneUrl: https://hub.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--api-token-path=/var/run/secrets/agentmesh/api-token"
      - notExists:
          path: spec.template.spec.containers[0].env
      - contains:
          path: spec.template.spec.volumes
          content:
            name: api-token
            secret:
              secretName: RELEASE-NAME-agentmesh-node-api-token
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: runs as the distroless nonroot uid with no capabilities
    template: templates/deployment.yaml
    set:
      controlPlaneUrl: https://hub.example.com
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: renders the service container when service.image is set
    template: templates/deployment.yaml
    set:
      controlPlaneUrl: http://agentmesh-control-plane:8080
      service:
        name: calc-mcp
        image: calc-mcp:local
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: calc-mcp
      - equal:
          path: spec.template.spec.containers[1].image
          value: calc-mcp:local

  - it: appends extraArgs
    template: templates/deployment.yaml
    set:
      controlPlaneUrl: http://agentmesh-control-plane:8080
      extraArgs: ["--discovery-interval=200ms"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--discovery-interval=200ms"

  - it: honors serviceAccount.name for the pod
    template: templates/deployment.yaml
    set:
      controlPlaneUrl: http://agentmesh-control-plane:8080
      serviceAccount:
        create: false
        name: existing-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa

  - it: serves metrics on a containerPort the probes use, apart from the API
    template: templates/deployment.yaml
    set:
      controlPlaneUrl: http://agentmesh-control-plane:8080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--metrics-addr=0.0.0.0:9090"
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: metrics
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9090
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: metrics
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz

  - it: metricsPort 0 drops the listener, the port and the probes together
    template: templates/deployment.yaml
    set:
      controlPlaneUrl: http://agentmesh-control-plane:8080
      metricsPort: 0
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--metrics-addr=0.0.0.0:9090"
      - notExists:
          path: spec.template.spec.containers[0].ports
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
