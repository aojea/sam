{{- if .Values.console.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentmesh.fullname" . }}-console
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "agentmesh.fullname" . }}-console
  template:
    metadata:
      annotations:
        # Secrets land as env vars, which are not live-reloaded; roll the pods on change.
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        app: {{ include "agentmesh.fullname" . }}-console
    spec:
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-control-plane
        image: curlimages/curl:8.6.0
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          # curlimages/curl's USER is non-numeric; runAsNonRoot needs an explicit uid.
          runAsUser: 100
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          CP_URL="http://{{ include "agentmesh.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}"
          until curl -sf "${CP_URL}/info" > /dev/null; do
            echo "Control plane not ready yet, sleeping..."
            sleep 2
          done
      containers:
      - name: agentmesh-console
        image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- with .Values.console.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: AGENTMESH_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "agentmesh.fullname" . }}-secrets
              key: admin-token
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /info
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /info
            port: http
          periodSeconds: 15
        resources:
          {{- toYaml .Values.console.resources | nindent 10 }}
        args:
        - "--control-plane=http://{{ include "agentmesh.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}"
        - "--bind-addr=:8081"
        - "--static-dir=/app/public"
        {{- with .Values.console.externalUrl }}
        - "--external-url={{ . }}"
        {{- end }}{{- end }}
