{{- if .Values.database.postgres.deployInternal -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentmesh.fullname" . }}-db
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "agentmesh.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "agentmesh.fullname" . }}-db
  template:
    metadata:
      labels:
        app: {{ include "agentmesh.fullname" . }}-db
    spec:
      automountServiceAccountToken: false
      {{- with .Values.database.postgres.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.database.postgres.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.database.postgres.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.database.postgres.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: postgres
        image: "{{ .Values.database.postgres.image.repository }}:{{ .Values.database.postgres.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- with .Values.database.postgres.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        # initdb chmods its data directory; running as uid 70 it cannot do
        # that to the PVC root (owned by root, group-shared via fsGroup), so
        # the cluster lives in a subdirectory postgres creates and owns.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_DB
          value: {{ .Values.database.postgres.database | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.database.postgres.user | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "agentmesh.fullname" . }}-secrets
              key: db-password
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", {{ .Values.database.postgres.user | quote }}, "-d", {{ .Values.database.postgres.database | quote }}]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", {{ .Values.database.postgres.user | quote }}, "-d", {{ .Values.database.postgres.database | quote }}]
          periodSeconds: 15
        resources:
          {{- toYaml .Values.database.postgres.resources | nindent 10 }}
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.database.postgres.storageSize | quote }}
{{- end }}
