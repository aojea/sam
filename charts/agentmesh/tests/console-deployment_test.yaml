suite: console deployment
templates:
  # secrets.yaml must be loaded for the checksum/secrets include to resolve
  - templates/console-deployment.yaml
  - templates/secrets.yaml
release:
  name: agentmesh
tests:
  - it: pins the numeric uids for the app and the curl init container
    template: templates/console-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 100

  - it: rolls the pods when the shared secret changes
    template: templates/console-deployment.yaml
    set:
      controlPlane.adminToken: aaa
      database.postgres.password: p
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secrets"]
          pattern: ^[0-9a-f]{64}$

  - it: console.enabled=false renders nothing
    template: templates/console-deployment.yaml
    set:
      console.enabled: false
    asserts:
      - hasDocuments:
          count: 0
