suite: monitoring
templates:
  - templates/monitoring.yaml
release:
  # collapses fullname to "agentmesh" (see _helpers.tpl)
  name: agentmesh
tests:
  - it: renders nothing by default, since both kinds are CRDs the cluster may lack
    asserts:
      - hasDocuments:
          count: 0

  - it: podMonitoring scrapes the control plane and router on their own ports
    set:
      monitoring.podMonitoring.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: PodMonitoring
      - isAPIVersion:
          of: monitoring.googleapis.com/v1
      - equal:
          path: spec.selector.matchLabels.app
          value: agentmesh-control-plane
        documentIndex: 0
      - equal:
          path: spec.endpoints[0].port
          value: http
        documentIndex: 0
      - equal:
          path: spec.selector.matchLabels.app
          value: agentmesh-router
        documentIndex: 1
      - equal:
          path: spec.endpoints[0].port
          value: metrics
        documentIndex: 1
      - equal:
          path: spec.endpoints[0].interval
          value: 30s
        documentIndex: 1

  - it: podMonitor renders the prometheus-operator shape with extra labels
    set:
      monitoring.podMonitor.enabled: true
      monitoring.podMonitor.labels:
        release: kube-prometheus-stack
      monitoring.interval: 15s
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: PodMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: spec.podMetricsEndpoints[0].path
          value: /metrics
      - equal:
          path: spec.podMetricsEndpoints[0].interval
          value: 15s

  - it: skips the router target when the router is disabled
    set:
      monitoring.podMonitoring.enabled: true
      router.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.selector.matchLabels.app
          value: agentmesh-control-plane

  - it: both collectors can be enabled at once
    set:
      monitoring.podMonitoring.enabled: true
      monitoring.podMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 4
